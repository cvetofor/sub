# Новый сайт на поддомене цветы.цветофор.рф (punycode xn--b1ag3bn2a.xn--b1ag1aakjpl.xn--p1ai).
# Положить в /etc/nginx/sites-available/cvety, включить симлинком в sites-enabled, затем certbot --nginx.
server {
    listen 80;
    server_name xn--b1ag3bn2a.xn--b1ag1aakjpl.xn--p1ai;
    root /var/www/cvety/public;
    index index.php;

    client_max_body_size 20m;

    # Статика: шрифты, картинки, собранный фронтенд
    location ~* \.(?:css|js|woff2|jpg|jpeg|png|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        # Тот же php-fpm, что у старого сайта; проверить версию сокета: ls /run/php/
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
