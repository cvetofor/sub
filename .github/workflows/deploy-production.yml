name: Выкат коммита redesign на production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Ветка, тег или полный SHA из redesign
        required: true
        default: redesign
        type: string
      run_migrations:
        description: Применить миграции базы данных
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cvety-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Проверка, сборка и выкат
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Убедиться, что коммит входит в redesign
        run: |
          git fetch origin redesign --depth=1
          git merge-base --is-ancestor HEAD origin/redesign

      - name: PHP 8.3 и зависимости для тестов
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, bcmath, gd
          coverage: none

      - name: Установить PHP-зависимости
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Собрать фронтенд до тестов
        run: npm ci && npm run build

      - name: Проверить PHP-код
        run: |
          cp .env.example .env
          php artisan key:generate
          vendor/bin/phpunit

      - name: Получить временный root-ключ через API Beget
        env:
          BEGET_LOGIN: ${{ secrets.BEGET_LOGIN }}
          BEGET_PASSWORD: ${{ secrets.BEGET_PASSWORD }}
          BEGET_API_PASSWORD: ${{ secrets.BEGET_API_PASSWORD }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$BEGET_LOGIN"
          test -n "$SSH_KNOWN_HOSTS"
          test -n "$BEGET_PASSWORD$BEGET_API_PASSWORD"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          KEY_PATH="$HOME/.ssh/id_deploy" MODE=ssh \
            VPS_IP=93.189.231.103 DOMAIN_IDN=цветы.цветофор.рф \
            bash deploy/beget-prepare.sh

      - name: Загрузить собранный фронтенд во временную папку
        id: release
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          TARGET="root@93.189.231.103"
          SSH="ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          $SSH "$TARGET" "install -d -m 700 '/var/www/cvety/.deploy/build/$SHA'"
          rsync -az --delete -e "$SSH" public/build/ "$TARGET:/var/www/cvety/.deploy/build/$SHA/"

      - name: Применить тот же коммит на сервере
        env:
          SHA: ${{ steps.release.outputs.sha }}
          RUN_MIGRATIONS: ${{ inputs.run_migrations }}
        run: |
          TARGET="root@93.189.231.103"
          SSH="ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          $SSH "$TARGET" "bash -s -- '$SHA' '$RUN_MIGRATIONS'" <<'REMOTE'
          set -Eeuo pipefail
          target="$1"
          run_migrations="$2"
          site="/var/www/cvety"
          cd "$site"

          exec 9>/var/lock/cvety-deploy.lock
          flock -n 9
          git fetch --quiet --unshallow origin redesign 2>/dev/null || git fetch --quiet origin redesign
          git cat-file -e "$target^{commit}"
          git merge-base --is-ancestor "$target" origin/redesign

          previous="$(git rev-parse HEAD)"
          dependencies_changed=0
          if ! git diff --quiet "$previous" "$target" -- composer.lock; then dependencies_changed=1; fi

          build_stage="$site/.deploy/build/$target"
          test -f "$build_stage/manifest.json"

          is_down=0
          bring_up() {
            if [ "$is_down" = 1 ]; then sudo -u www-data php artisan up || true; fi
          }
          trap bring_up EXIT

          sudo -u www-data php artisan down --retry=60
          is_down=1
          git reset --hard "$target"
          git ls-files -z | xargs -0 -r chown codex-sub:codex-sub

          if [ "$dependencies_changed" = 1 ]; then
            COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          fi

          install -d -o www-data -g www-data -m 0755 public/build
          rsync -a --delete --chown=www-data:www-data "$build_stage/" public/build/

          if [ "$run_migrations" = true ]; then sudo -u www-data php artisan migrate --force; fi
          sudo -u www-data php artisan optimize:clear
          sudo -u www-data php artisan config:cache
          sudo -u www-data php artisan route:cache
          sudo -u www-data php artisan view:cache
          sudo -u www-data php artisan up
          is_down=0
          REMOTE

      - name: Проверить сервер
        env:
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          TARGET="root@93.189.231.103"
          SSH="ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          $SSH "$TARGET" "test \"\$(git -C /var/www/cvety rev-parse HEAD)\" = '$SHA' && curl --fail --silent --show-error --max-time 15 --resolve 'xn--b1ag3bn2a.xn--b1ag1aakjpl.xn--p1ai:443:127.0.0.1' https://xn--b1ag3bn2a.xn--b1ag1aakjpl.xn--p1ai/ >/dev/null"
