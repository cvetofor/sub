name: Выкат нового сайта на поддомен

# Запускается вручную. Копирует ветку redesign на VPS в отдельную папку рядом со старым сайтом
# и запускает deploy/setup-cvety.sh. Старый сайт (REMOTE_PATH) не меняется.
on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Домен нового сайта в punycode'
        required: true
        default: 'xn--b1ag3bn2a.xn--b1ag1aakjpl.xn--p1ai'
      site_host:
        description: 'Домен по-русски для СМС и документов'
        required: true
        default: 'цветы.цветофор.рф'
      new_path:
        description: 'Папка нового сайта на сервере'
        required: true
        default: '/var/www/cvety'
      new_db:
        description: 'Имя новой базы (копия старой)'
        required: true
        default: 'cvety_sub'
      ssh_host:
        description: 'IP сервера'
        required: true
        default: '93.189.231.103'
      ssh_user:
        description: 'Пользователь SSH'
        required: true
        default: 'root'
      old_path:
        description: 'Папка старого сайта (пусто = найти автоматически по .env)'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Сборка фронтенда
        run: npm ci && npm run build

      - name: Доступ к серверу
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          BEGET_LOGIN: ${{ secrets.BEGET_LOGIN }}
          BEGET_PASSWORD: ${{ secrets.BEGET_PASSWORD }}
          BEGET_API_PASSWORD: ${{ secrets.BEGET_API_PASSWORD }}
          VPS_IP: ${{ inputs.ssh_host }}
          DOMAIN_IDN: ${{ inputs.site_host }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H "$VPS_IP" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' "$VPS_IP" "${{ inputs.ssh_user }}" > ~/.ssh/config
          ok=0
          # 1. Готовый ключ из секрета, если он подходит к серверу
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
            if ssh -o BatchMode=yes -o ConnectTimeout=10 vps 'echo ok' 2>/dev/null | grep -q ok; then ok=1; echo "вход по готовому ключу"; else echo "ключ из SSH_PRIVATE_KEY сервер не принимает, пробую другие способы"; fi
          fi
          # 2. Через API Beget: новый ключ на сервер и DNS-запись
          if [ "$ok" = 0 ] && [ -n "$BEGET_LOGIN" ] && { [ -n "$BEGET_PASSWORD" ] || [ -n "$BEGET_API_PASSWORD" ]; }; then
            KEY_PATH=~/.ssh/id_deploy bash deploy/beget-prepare.sh && ok=1
          fi
          # 3. Пароль root
          if [ "$ok" = 0 ] && [ -n "$SSH_PASSWORD" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
            printf 'Host vps\n  HostName %s\n  User %s\n' "$VPS_IP" "${{ inputs.ssh_user }}" > ~/.ssh/config
            printf '#!/bin/sh\nexec sshpass -e /usr/bin/ssh "$@"\n' | sudo tee /usr/local/bin/ssh >/dev/null && sudo chmod +x /usr/local/bin/ssh
            echo "SSHPASS=$SSH_PASSWORD" >> "$GITHUB_ENV"; export SSHPASS="$SSH_PASSWORD"; hash -r
            ok=1; echo "вход по паролю"
          fi
          [ "$ok" = 1 ] || { echo "Ни один способ доступа не сработал: нужен рабочий SSH_PRIVATE_KEY, или BEGET_LOGIN + пароль API, или SSH_PASSWORD"; exit 1; }
          ssh vps 'echo "SSH работает: $(hostname), $(whoami)"'

      - name: DNS-запись через API Beget
        if: always()
        continue-on-error: true
        env:
          BEGET_LOGIN: ${{ secrets.BEGET_LOGIN }}
          BEGET_API_PASSWORD: ${{ secrets.BEGET_API_PASSWORD }}
          VPS_IP: ${{ inputs.ssh_host }}
          DOMAIN_IDN: ${{ inputs.site_host }}
        run: |
          if [ -n "$BEGET_LOGIN" ] && [ -n "$BEGET_API_PASSWORD" ]; then MODE=dns bash deploy/beget-prepare.sh; else echo "Нет BEGET_LOGIN/BEGET_API_PASSWORD, DNS-запись добавьте вручную"; fi

      - name: Копирование кода и сборки
        run: |
          ssh vps "mkdir -p '${{ inputs.new_path }}'"
          rsync -az --delete \
            --exclude '.git' --exclude 'node_modules' --exclude 'vendor' --exclude '.env' \
            --exclude 'storage/logs' --exclude 'storage/framework/sessions' --exclude 'storage/framework/cache' --exclude 'storage/app' \
            ./ vps:${{ inputs.new_path }}/

      - name: Настройка на сервере
        run: |
          ssh vps \
            "OLD_PATH='${{ inputs.old_path }}' NEW_PATH='${{ inputs.new_path }}' DOMAIN='${{ inputs.domain }}' SITE_HOST='${{ inputs.site_host }}' NEW_DB='${{ inputs.new_db }}' EXTRA_ENV='${{ secrets.CVETY_EXTRA_ENV }}' bash '${{ inputs.new_path }}/deploy/setup-cvety.sh'"
